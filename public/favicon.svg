<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient (Deep Space Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Core Gengarileo Gradient: Soft Lavender to Aero Sky -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="45%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Orbit Stroke Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Center Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Icon Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Space Atmosphere -->
  <circle cx="50" cy="50" r="28" fill="#8B5CF6" opacity="0.25" />
  <circle cx="72" cy="40" r="16" fill="#38BDF8" opacity="0.2" />

  <!-- Galileo Celestial Orbit Ring -->
  <ellipse cx="50" cy="53" rx="38" ry="15" 
           stroke="url(#orbitGrad)" stroke-width="3" 
           stroke-linecap="round" stroke-dasharray="175 45" 
           transform="rotate(-26 50 53)" />

  <ellipse cx="50" cy="53" rx="34" ry="11" 
           stroke="#7DD3FC" stroke-width="1.2" 
           stroke-linecap="round" stroke-dasharray="140 60" 
           transform="rotate(-26 50 53)" opacity="0.6" />

  <!-- Cosmic Crown Silhouette Body -->
  <path d="
    M 35 32
    L 41 42
    L 47 37
    L 50 42
    L 53 37
    L 59 42
    L 65 32
    C 71 42, 73 54, 71 66
    L 68 74
    L 62 69
    L 56 76
    L 50 68
    L 44 76
    L 38 69
    L 32 74
    C 27 54, 29 42, 35 32
    Z
  " fill="url(#coreGrad)" />

  <!-- Playful Sharp Minimal Eyes -->
  <path d="M 42 49 L 47 47 L 45 53 Z" fill="#0F172A" />
  <path d="M 58 49 L 53 47 L 55 53 Z" fill="#0F172A" />

  <!-- Center Galileo 4-Point Nova Star (Butter Yellow) -->
  <circle cx="50" cy="61" r="7" fill="url(#starGlow)" opacity="0.4" />
  <path d="M 50 53 Q 50 61 42 61 Q 50 61 50 69 Q 50 61 58 61 Q 50 61 50 53 Z" fill="#FEF08A" />
  <circle cx="50" cy="61" r="1.5" fill="#FFFFFF" />

  <!-- Cosmic Satellite Points -->
  <circle cx="78" cy="40" r="2.2" fill="#38BDF8" />
  <circle cx="21" cy="62" r="1.8" fill="#FEF08A" />
</svg>